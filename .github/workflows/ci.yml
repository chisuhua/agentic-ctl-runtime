# HydraForge CI — configure + build + test + lint
# 功能描述: GitHub Actions 持续集成工作流
# 触发条件: push / pull_request 到 main 或 phase-c1-migration 分支
# 矩阵策略: 2 presets (tests, asan) × 2 compilers (gcc, clang++) = 4 个并行 job
# Stage 5 / Task 25 of project-organization plan
name: CI

on:
  push:
    branches: [main, phase-c1-migration]
  pull_request:
    branches: [main, phase-c1-migration]

# 取消同一分支的进行中运行（避免资源浪费）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.preset }} / ${{ matrix.compiler.cxx }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset:
          - tests        # Debug + ctest enabled (primary)
          - asan         # AddressSanitizer
          - tsan         # ThreadSanitizer
        compiler:
          - { cc: gcc,   cxx: g++ }
          - { cc: clang, cxx: clang++ }

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive  # yaml-cpp, nlohmann_json, inja 需递归 init

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            python3 \
            python3-pip \
            jq \
            libyaml-cpp-dev

      - name: Install Python dependencies (phase-7a-baseline-retest-v2)
        # ADR-0074 D5 v2 semantics — baseline schema validation (jsonschema)
        run: |
          pip install -r requirements.txt

      - name: Clone async dependencies (async_simple + taskflow)
        # external/async_simple/ 和 external/taskflow/ 在 .gitignore 中,
        # 本地开发者手动 clone; CI runner 无此步骤会失败
        # Sprint 0 W1D3 修复 (chi) — 见 phase1-execution.md §W1D2
        run: |
          if [ ! -d "external/async_simple" ]; then
            git clone --depth 1 https://github.com/alibaba/async_simple.git external/async_simple
          fi
          if [ ! -d "external/taskflow" ]; then
            git clone --depth 1 https://github.com/taskflow/taskflow.git external/taskflow
          fi

      - name: Configure (preset=${{ matrix.preset }}, compiler=${{ matrix.compiler.cxx }})
        env:
          CC: ${{ matrix.compiler.cc }}
          CXX: ${{ matrix.compiler.cxx }}
        run: |
          cmake --preset ${{ matrix.preset }} -S . \
            -G Ninja \
            -DCMAKE_C_COMPILER=${{ matrix.compiler.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler.cxx }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -j2

      - name: Test (ctest, output on failure)
        working-directory: build/${{ matrix.preset }}
        run: ctest --output-on-failure

      - name: Lint (clang-tidy on core headers, tests+clang only)
        if: matrix.preset == 'tests' && matrix.compiler.cxx == 'clang++'
        run: |
          # 可选步骤：对公共头文件运行 clang-tidy
          # 注: lint 失败不阻塞 CI（使用 || true），仅作为参考信号
          echo "Linting core public headers with clang-tidy..."
          for f in include/agenticdsl/types/layered_context.h \
                   include/agenticdsl/contract/ischeduler.h \
                   include/agenticdsl/contract/iparser.h \
                   include/agenticdsl/contract/iinteraction_bus.h; do
            if [ -f "$f" ]; then
              clang-tidy --quiet "$f" -- -Iinclude -Iexternal/nlohmann_json/include 2>&1 | head -5 || true
            fi
          done

      - name: LSP discipline (clangd --check, tests+gcc only)
        # 验证: clangd 能正确解析 pdk 文件 (vs LSP false positive)
        # Sprint 19 新增: docs/audits/2026-07-03-pdk-model-router-lsp-false-positive.md
        # 注: 非阻塞 — 仅作为参考信号 (false positive 不阻塞 CI)
        if: matrix.preset == 'tests' && matrix.compiler.cc == 'gcc'
        run: |
          echo "Installing clangd..."
          sudo apt-get install -y clangd-18 2>&1 | tail -3 || sudo apt-get install -y clangd 2>&1 | tail -3 || true
          echo "Running LSP discipline check..."
          CI_BUILD_DIR="build/${{ matrix.preset }}"
          if [ -f "$CI_BUILD_DIR/compile_commands.json" ]; then
            ./scripts/check-lsp-discipline.sh --quick \
              --compile-commands "$CI_BUILD_DIR/compile_commands.json" || true
          else
            echo "WARNING: $CI_BUILD_DIR/compile_commands.json not found, skipping LSP check"
          fi

  docker-tsan:
    name: TSan validation (Dockerfile.tsan, ASLR-free)
    # Sprint 3 收官交付: 容器化 TSan 验证 (plan §3.3 H1 — 解决 ASLR 已知遗留)
    # Dockerfile.tsan: ubuntu:22.04 + gcc-13 + ASLR=0, 1000x 并发用例 TSan 干净
    runs-on: ubuntu-latest
    timeout-minutes: 30  # docker build + TSan 编译耗时

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive  # yaml-cpp, nlohmann_json, inja 需递归 init

      - name: Clone async dependencies (async_simple + taskflow)
        run: |
          if [ ! -d "external/async_simple" ]; then
            git clone --depth 1 https://github.com/alibaba/async_simple.git external/async_simple
          fi
          if [ ! -d "external/taskflow" ]; then
            git clone --depth 1 https://github.com/taskflow/taskflow.git external/taskflow
          fi

      - name: Build Dockerfile.tsan (ASLR=0, gcc-13, ThreadSanitizer)
        run: |
          echo "Building hydraforge-tsan (Sprint 3 收官验证)..."
          docker build -f Dockerfile.tsan -t hydraforge-tsan .

      - name: Run test_domain_worker_pool in TSan container
        # 验证: 7/7 test case TSan 干净, 1000x 并发用例无 data race
        run: |
          echo "Running TSan validation..."
          docker run --rm hydraforge-tsan
          echo "TSan validation passed (7/7 test case, 94 assertions)"